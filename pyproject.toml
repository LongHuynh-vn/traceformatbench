[project]
name = "traceformatbench"
version = "0.1.0"
description = "How should distributed traces be serialized for LLMs? Accuracy per token across formats, models, and budgets."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=0.24",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceformatbench"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
