# Fixed trace windows for all experiments (spec 003).
# Run: uv run python scripts/build_windows.py configs/windows_v1.yaml
# Window counts: 2026-09-29 the runtime probe allowed 7 windows per case (~39.7 h main grid, F1 time as the bound
# for F2-F5). 2026-09-30, after the spec 005 smoke run and the spec 005b T1P pilot (constant T1 answers per model),
# the student made T2 the primary task: 1 T1 window per phase + 5 T2 windows (still 7 per case, same budget).
seed: 20260929
data_dir: data/raw/rcaeval
datasets: [RE2-OB, RE2-TT, RE3-OB, RE3-TT]
repetitions: [1]            # 1 case per (fault, service) pair: 78 cases; null = all 240
window_size: 5
max_trace_chars: 10000
guard_seconds: 60
t1_windows_per_phase: 1     # T1: this many pre AND this many post windows per case (balanced)
t2_windows: 5               # T2: this many post windows per case
output_windows: data/windows/windows_v1.jsonl
output_stats: results/window_stats/windows_v1.csv
